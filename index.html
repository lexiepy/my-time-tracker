<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TimeTracker - Step by Step</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --accent-color: #0a84ff;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --success: #30d158;
            --danger: #ff453a;
            --border-color: #38383a;
            --border-radius: 18px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }

        .kpi-container {
            background: linear-gradient(180deg, #2c2c2e 0%, #1c1c1e 100%);
            padding: 25px 15px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .kpi-value { font-size: 3.5rem; font-weight: 800; margin: 5px 0; letter-spacing: -2px; line-height: 1; }
        .kpi-label { color: var(--text-secondary); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }

        .input-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        label { color: var(--text-secondary); font-size: 0.75rem; font-weight: 700; }
        
        input {
            background: #2c2c2e;
            border: 1px solid transparent;
            color: white;
            padding: 12px 8px;
            border-radius: 12px;
            font-size: 1rem;
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }

        /* Pulsanti differenziati per step */
        .btn-main {
            width: 100%;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-step1 { background: var(--accent-color); color: white; }
        .btn-step2 { background: var(--success); color: white; }

        .backup-section { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-util { flex: 1; background: #1c1c1e; border: 1px solid #333; color: #8e8e93; padding: 10px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; cursor: pointer; }
        
        .week-box { background: var(--card-bg); border-radius: var(--border-radius); margin-bottom: 12px; border: 1px solid var(--border-color); overflow: hidden; }
        .week-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        
        table { width: 100%; border-collapse: collapse; }
        td { padding: 14px 15px; border-top: 1px solid #2c2c2e; font-size: 0.85rem; }
        .pos { color: var(--success); }
        .neg { color: var(--danger); }
        .btn-del { color: #444; background: none; border: none; font-size: 1.2rem; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header class="kpi-container">
        <div class="kpi-label">Saldo Settimanale</div>
        <div id="mainBalance" class="kpi-value">0h 0m</div>
    </header>

    <div class="input-card">
        <div class="grid-inputs">
            <div class="field"><label>Data</label><input type="date" id="d_date"></div>
            <div class="field"><label>Pausa (min)</label><input type="number" id="d_break" value="30"></div>
            <div class="field"><label>Ingresso</label><input type="time" id="d_in" value="08:00"></div>
            <div class="field" id="field_out" style="display:none"><label>Uscita</label><input type="time" id="d_out" value="16:00"></div>
        </div>
        
        <button id="btn_step1" class="btn-main btn-step1" onclick="saveEntry()">Registra Entrata</button>
        <button id="btn_step2" class="btn-main btn-step2" style="display:none" onclick="saveExit()">Registra Uscita e Chiudi</button>
        <button id="btn_cancel" class="btn-util" style="width:100%; margin-top:10px; display:none; border:none" onclick="cancelPending()">Annulla Entrata</button>
    </div>

    <div class="backup-section">
        <button class="btn-util" onclick="exportData()" style="border:none">📦 BACKUP</button>
        <button class="btn-util" onclick="importData()" style="border:none">📥 CARICA</button>
    </div>

    <div id="history"></div>
</div>

<script>
    const TARGET_MINUTES = 8 * 60; 
    const FRIDAY_TARGET = 6 * 60;
    const MAX_FREE_BREAK = 30;

    let logs = JSON.parse(localStorage.getItem('timeLogs_v6')) || [];
    let pending = JSON.parse(localStorage.getItem('pendingEntry')) || null;

    function init() {
        document.getElementById('d_date').valueAsDate = new Date();
        refreshUI();
        render();
    }

    function refreshUI() {
        const fOut = document.getElementById('field_out');
        const b1 = document.getElementById('btn_step1');
        const b2 = document.getElementById('btn_step2');
        const bc = document.getElementById('btn_cancel');
        const iIn = document.getElementById('d_in');

        if (pending) {
            fOut.style.display = 'flex';
            b1.style.display = 'none';
            b2.style.display = 'block';
            bc.style.display = 'block';
            iIn.value = pending.in;
            iIn.disabled = true;
            document.getElementById('d_date').value = pending.date;
        } else {
            fOut.style.display = 'none';
            b1.style.display = 'block';
            b2.style.display = 'none';
            bc.style.display = 'none';
            iIn.disabled = false;
        }
    }

    function saveEntry() {
        const valIn = document.getElementById('d_in').value;
        const valDate = document.getElementById('d_date').value;
        pending = { in: valIn, date: valDate };
        localStorage.setItem('pendingEntry', JSON.stringify(pending));
        refreshUI();
    }

    function saveExit() {
        const valOut = document.getElementById('d_out').value;
        const realBreak = parseInt(document.getElementById('d_break').value) || 0;
        
        const [h1, m1] = pending.in.split(':').map(Number);
        const [h2, m2] = valOut.split(':').map(Number);
        const presence = (h2 * 60 + m2) - (h1 * 60 + m1);

        if (presence <= 0) { alert("L'uscita deve essere dopo l'entrata!"); return; }

        const isFri = new Date(pending.date).getDay() === 5;
        const target = isFri ? FRIDAY_TARGET : TARGET_MINUTES;
        const extraBreak = (!isFri && realBreak > MAX_FREE_BREAK) ? (realBreak - MAX_FREE_BREAK) : 0;
        const delta = presence - target - extraBreak;

        logs.push({ id: Date.now(), date: pending.date, weekID: getISOWeek(pending.date), in: pending.in, out: valOut, pause: realBreak, delta: delta });
        logs.sort((a,b) => new Date(b.date) - new Date(a.date));
        
        pending = null;
        localStorage.removeItem('pendingEntry');
        save();
        refreshUI();
    }

    function cancelPending() {
        if(confirm("Vuoi annullare l'entrata registrata?")) {
            pending = null;
            localStorage.removeItem('pendingEntry');
            refreshUI();
        }
    }

    function getISOWeek(date) {
        const d = new Date(date);
        d.setHours(0,0,0,0);
        d.setDate(d.getDate() + 4 - (d.getDay() || 7));
        return `${d.getFullYear()}-W${Math.ceil((((d - new Date(d.getFullYear(),0,1)) / 86400000) + 1) / 7)}`;
    }

    function save() {
        localStorage.setItem('timeLogs_v6', JSON.stringify(logs));
        render();
    }

    function fmt(m) {
        const s = m >= 0 ? "+" : "-";
        const a = Math.abs(m);
        return `${s}${Math.floor(a/60)}h ${a%60}m`;
    }

    function render() {
        const container = document.getElementById('history');
        const mainBal = document.getElementById('mainBalance');
        container.innerHTML = '';
        const currentWeekID = getISOWeek(new Date());
        let currentWeekTotal = 0;
        const groups = {};

        logs.forEach(l => {
            if(!groups[l.weekID]) groups[l.weekID] = { items: [], sum: 0 };
            groups[l.weekID].items.push(l);
            groups[l.weekID].sum += l.delta;
            if(l.weekID === currentWeekID) currentWeekTotal += l.delta;
        });

        Object.keys(groups).sort().reverse().forEach(wId => {
            const data = groups[wId];
            const div = document.createElement('div');
            div.className = 'week-box';
            div.innerHTML = `
                <div class="week-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
                    <span style="font-weight:700">Settimana ${wId.split('W')[1]}</span>
                    <span class="${data.sum >= 0 ? 'pos' : 'neg'}" style="font-weight:700">${fmt(data.sum)}</span>
                </div>
                <div class="${wId === currentWeekID ? '' : 'hidden'}">
                    <table>
                        ${data.items.map(i => `
                            <tr>
                                <td><strong>${new Date(i.date).toLocaleDateString('it-IT',{day:'2-digit', month:'short'})}</strong></td>
                                <td>${i.in}–${i.out} <div style="font-size:0.65rem; color:#8e8e93">Pausa: ${i.pause}m</div></td>
                                <td class="${i.delta >= 0 ? 'pos' : 'neg'}" style="text-align:right"><strong>${fmt(i.delta)}</strong></td>
                                <td style="text-align:right"><button class="btn-del" onclick="event.stopPropagation(); del(${i.id})">×</button></td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
            `;
            container.appendChild(div);
        });

        mainBal.innerText = fmt(currentWeekTotal);
        mainBal.className = `kpi-value ${currentWeekTotal >= 0 ? 'pos' : 'neg'}`;
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(logs)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "backup.json";
        a.click();
    }

    function importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.readAsText(e.target.files[0]);
            reader.onload = e => { logs = JSON.parse(e.target.result); save(); };
        };
        input.click();
    }

    window.del = (id) => { if(confirm('Eliminare?')) { logs = logs.filter(l => l.id !== id); save(); } };
    
    init();
</script>
</body>
</html>
