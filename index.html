<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTracker - Weekly Reset</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --accent-color: #0a84ff;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --success: #30d158;
            --danger: #ff453a;
            --border-color: #38383a;
            --border-radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }

        .kpi-container {
            background: linear-gradient(180deg, #1c1c1e 0%, #000000 100%);
            padding: 30px;
            border-radius: var(--border-radius);
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .kpi-label { color: var(--accent-color); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; }
        .kpi-value { font-size: 3.5rem; font-weight: 800; margin: 5px 0; letter-spacing: -1px; }

        .input-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        label { color: var(--text-secondary); font-size: 0.75rem; font-weight: 600; margin-left: 5px; }
        input {
            background: #2c2c2e;
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
        }
        
        .btn-submit {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        .week-box {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            overflow: hidden;
        }
        .week-header {
            background: #2c2c2e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .week-title { font-weight: 700; font-size: 0.9rem; }
        .week-delta { font-weight: 700; font-size: 0.9rem; padding: 4px 10px; border-radius: 8px; background: rgba(0,0,0,0.3); }

        .table-wrapper { overflow-x: auto; padding: 5px; }
        table { width: 100%; border-collapse: collapse; min-width: 400px; }
        th { text-align: left; padding: 12px; color: var(--text-secondary); font-size: 0.65rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #2c2c2e; font-size: 0.85rem; }
        
        .pos { color: var(--success); }
        .neg { color: var(--danger); }
        .btn-del { color: var(--danger); background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 0 10px; opacity: 0.5; }
        .btn-del:hover { opacity: 1; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header class="kpi-container">
        <div class="kpi-label">Saldo Settimana Corrente</div>
        <div id="mainBalance" class="kpi-value">0h 0m</div>
        <div id="weekRange" style="font-size: 0.75rem; color: var(--text-secondary);">Recupero basato sui 3 giorni di presenza</div>
    </header>

    <div class="input-card">
        <div class="grid-inputs">
            <div class="field"><label>Data</label><input type="date" id="d_date"></div>
            <div class="field"><label>Pausa (min)</label><input type="number" id="d_break" value="30"></div>
            <div class="field"><label>Ingresso</label><input type="time" id="d_in" value="09:00"></div>
            <div class="field"><label>Uscita</label><input type="time" id="d_out" value="18:00"></div>
        </div>
        <button class="btn-submit" onclick="addEntry()">Registra Presenza</button>
    </div>

    <div id="history"></div>
</div>

<script>
    const TARGETS = { standard: 8, friday: 6 };
    document.getElementById('d_date').valueAsDate = new Date();

    let logs = JSON.parse(localStorage.getItem('timeLogs_v3')) || [];

    function getISOWeek(date) {
        const d = new Date(date);
        d.setHours(0,0,0,0);
        d.setDate(d.getDate() + 4 - (d.getDay() || 7));
        const yearStart = new Date(d.getFullYear(),0,1);
        const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        return `${d.getFullYear()}-W${weekNo}`;
    }

    function addEntry() {
        const dateVal = document.getElementById('d_date').value;
        const inVal = document.getElementById('d_in').value;
        const outVal = document.getElementById('d_out').value;
        const breakVal = parseInt(document.getElementById('d_break').value) || 0;

        if(!dateVal || !inVal || !outVal) return;

        const d = new Date(dateVal);
        const [h1, m1] = inVal.split(':').map(Number);
        const [h2, m2] = outVal.split(':').map(Number);
        
        let worked = (h2 * 60 + m2) - (h1 * 60 + m1);
        const isFri = d.getDay() === 5;
        const targetMin = (isFri ? TARGETS.friday : TARGETS.standard) * 60;
        const pause = isFri ? 0 : breakVal;
        
        const delta = worked - pause - targetMin;

        logs.push({
            id: Date.now(),
            date: dateVal,
            weekID: getISOWeek(d),
            in: inVal,
            out: outVal,
            pause: pause,
            delta: delta
        });

        logs.sort((a,b) => new Date(b.date) - new Date(a.date));
        save();
    }

    function save() {
        localStorage.setItem('timeLogs_v3', JSON.stringify(logs));
        render();
    }

    function fmt(m) {
        const s = m >= 0 ? "+" : "-";
        const a = Math.abs(m);
        return `${s}${Math.floor(a/60)}h ${a%60}m`;
    }

    function render() {
        const container = document.getElementById('history');
        const mainBal = document.getElementById('mainBalance');
        container.innerHTML = '';
        
        const currentWeekID = getISOWeek(new Date());
        let currentWeekTotal = 0;
        const groups = {};

        logs.forEach(l => {
            if(!groups[l.weekID]) groups[l.weekID] = { items: [], sum: 0 };
            groups[l.weekID].items.push(l);
            groups[l.weekID].sum += l.delta;
            
            // Se il log appartiene alla settimana attuale, aggiungi al KPI
            if(l.weekID === currentWeekID) {
                currentWeekTotal += l.delta;
            }
        });

        const sortedWeekIDs = Object.keys(groups).sort().reverse();

        sortedWeekIDs.forEach(wId => {
            const data = groups[wId];
            const isCurrent = (wId === currentWeekID);
            
            const div = document.createElement('div');
            div.className = 'week-box';
            div.innerHTML = `
                <div class="week-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
                    <span class="week-title">${wId.replace('-W', ' · Settimana ')} ${isCurrent ? '(Corrente)' : ''}</span>
                    <span class="week-delta ${data.sum >= 0 ? 'pos' : 'neg'}">${fmt(data.sum)}</span>
                </div>
                <div class="table-wrapper ${!isCurrent ? 'hidden' : ''}">
                    <table>
                        <thead><tr><th>Data</th><th>Orario</th><th>Pausa</th><th>Saldo</th><th></th></tr></thead>
                        <tbody>
                            ${data.items.map(i => `
                                <tr>
                                    <td><strong>${new Date(i.date).toLocaleDateString('it-IT',{weekday:'short', day:'2-digit'})}</strong></td>
                                    <td>${i.in}-${i.out}</td>
                                    <td>${i.pause}m</td>
                                    <td class="${i.delta >= 0 ? 'pos' : 'neg'}"><strong>${fmt(i.delta)}</strong></td>
                                    <td><button class="btn-del" onclick="event.stopPropagation(); del(${i.id})">×</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            container.appendChild(div);
        });

        mainBal.innerText = fmt(currentWeekTotal);
        mainBal.className = `kpi-value ${currentWeekTotal >= 0 ? 'pos' : 'neg'}`;
    }

    window.del = (id) => { if(confirm('Eliminare questa voce?')) { logs = logs.filter(l => l.id !== id); save(); } };
    render();
</script>
</body>
</html>
