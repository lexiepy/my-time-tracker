<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TimeTracker - Live Badge</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --accent-color: #0a84ff;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --success: #30d158;
            --danger: #ff453a;
            --warning: #ff9f0a;
            --border-color: #38383a;
            --border-radius: 18px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }

        .kpi-container {
            background: linear-gradient(180deg, #2c2c2e 0%, #1c1c1e 100%);
            padding: 25px 15px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .kpi-value { font-size: 3.5rem; font-weight: 800; margin: 5px 0; letter-spacing: -2px; line-height: 1; }
        .kpi-label { color: var(--text-secondary); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }

        .input-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        /* Status Badge */
        .status-banner {
            display: none;
            background: rgba(10, 132, 255, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        label { color: var(--text-secondary); font-size: 0.75rem; font-weight: 700; }
        
        input {
            background: #2c2c2e;
            border: 1px solid transparent;
            color: white;
            padding: 12px 8px;
            border-radius: 12px;
            font-size: 1rem;
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }

        /* Pulsanti Dinamici */
        .btn-main {
            width: 100%;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-in { background: var(--accent-color); }
        .btn-out { background: var(--warning); color: black; }

        .backup-section { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-util { flex: 1; background: #1c1c1e; border: 1px solid #333; color: #8e8e93; padding: 10px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; border: none; cursor: pointer; }
        
        .week-box { background: var(--card-bg); border-radius: var(--border-radius); margin-bottom: 12px; border: 1px solid var(--border-color); overflow: hidden; }
        .week-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        
        table { width: 100%; border-collapse: collapse; }
        td { padding: 14px 15px; border-top: 1px solid #2c2c2e; font-size: 0.85rem; }
        .pos { color: var(--success); }
        .neg { color: var(--danger); }
        .btn-del { color: #444; background: none; border: none; font-size: 1.2rem; padding: 5px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header class="kpi-container">
        <div class="kpi-label">Saldo Settimanale</div>
        <div id="mainBalance" class="kpi-value">0h 0m</div>
    </header>

    <div class="input-card">
        <div id="statusBanner" class="status-banner">✨ In servizio dalle <span id="startTimeDisplay">--:--</span></div>
        
        <div class="grid-inputs">
            <div class="field"><label>Data</label><input type="date" id="d_date"></div>
            <div class="field"><label>Pausa (min)</label><input type="number" id="d_break" value="30"></div>
            <div class="field"><label>Ingresso</label><input type="time" id="d_in"></div>
            <div class="field"><label>Uscita</label><input type="time" id="d_out"></div>
        </div>
        
        <button id="actionBtn" class="btn-main btn-in" onclick="handleAction()">Entra Ora</button>
        <button id="resetBtn" class="btn-util" style="margin-top:10px; width:100%; display:none" onclick="resetLive()">Annulla Timbrata</button>
    </div>

    <div class="backup-section">
        <button class="btn-util" onclick="exportData()">📦 BACKUP</button>
        <button class="btn-util" onclick="importData()">📥 CARICA</button>
    </div>

    <div id="history"></div>
</div>

<script>
    const TARGET_MINUTES = 8 * 60; 
    const FRIDAY_TARGET = 6 * 60;
    const MAX_FREE_BREAK = 30;

    let logs = JSON.parse(localStorage.getItem('timeLogs_v6')) || [];
    let activeSession = JSON.parse(localStorage.getItem('activeSession')) || null;

    function init() {
        document.getElementById('d_date').valueAsDate = new Date();
        updateUI();
        render();
    }

    function updateUI() {
        const btn = document.getElementById('actionBtn');
        const banner = document.getElementById('statusBanner');
        const resetBtn = document.getElementById('resetBtn');
        const inputIn = document.getElementById('d_in');
        const inputOut = document.getElementById('d_out');

        if (activeSession) {
            btn.innerText = "Esci Ora";
            btn.className = "btn-main btn-out";
            banner.style.display = "block";
            resetBtn.style.display = "block";
            document.getElementById('startTimeDisplay').innerText = activeSession.in;
            inputIn.value = activeSession.in;
            inputIn.disabled = true;
            inputOut.value = getCurrentTime();
        } else {
            btn.innerText = "Entra Ora";
            btn.className = "btn-main btn-in";
            banner.style.display = "none";
            resetBtn.style.display = "none";
            inputIn.disabled = false;
            inputIn.value = "08:00";
            inputOut.value = "16:00";
        }
    }

    function getCurrentTime() {
        const now = new Date();
        return now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
    }

    function handleAction() {
        if (!activeSession) {
            // Entrata
            const timeIn = getCurrentTime();
            activeSession = { in: timeIn, date: document.getElementById('d_date').value };
            localStorage.setItem('activeSession', JSON.stringify(activeSession));
        } else {
            // Uscita
            completeEntry();
        }
        updateUI();
    }

    function completeEntry() {
        const d_date = activeSession.date;
        const d_in = activeSession.in;
        const d_out = getCurrentTime();
        const realBreak = parseInt(document.getElementById('d_break').value) || 0;

        const [h1, m1] = d_in.split(':').map(Number);
        const [h2, m2] = d_out.split(':').map(Number);
        
        const presence = (h2 * 60 + m2) - (h1 * 60 + m1);
        const isFri = new Date(d_date).getDay() === 5;
        const target = isFri ? FRIDAY_TARGET : TARGET_MINUTES;

        const extraBreak = (!isFri && realBreak > MAX_FREE_BREAK) ? (realBreak - MAX_FREE_BREAK) : 0;
        const delta = presence - target - extraBreak;

        logs.push({ id: Date.now(), date: d_date, weekID: getISOWeek(d_date), in: d_in, out: d_out, pause: realBreak, delta: delta });
        logs.sort((a,b) => new Date(b.date) - new Date(a.date));
        
        activeSession = null;
        localStorage.removeItem('activeSession');
        save();
    }

    function resetLive() {
        if(confirm("Annullare la timbrata di ingresso attuale?")) {
            activeSession = null;
            localStorage.removeItem('activeSession');
            updateUI();
        }
    }

    function getISOWeek(date) {
        const d = new Date(date);
        d.setHours(0,0,0,0);
        d.setDate(d.getDate() + 4 - (d.getDay() || 7));
        return `${d.getFullYear()}-W${Math.ceil((((d - new Date(d.getFullYear(),0,1)) / 86400000) + 1) / 7)}`;
    }

    function save() {
        localStorage.setItem('timeLogs_v6', JSON.stringify(logs));
        render();
    }

    function fmt(m) {
        const s = m >= 0 ? "+" : "-";
        const a = Math.abs(m);
        return `${s}${Math.floor(a/60)}h ${a%60}m`;
    }

    function render() {
        const container = document.getElementById('history');
        const mainBal = document.getElementById('mainBalance');
        container.innerHTML = '';
        const currentWeekID = getISOWeek(new Date());
        let currentWeekTotal = 0;
        const groups = {};

        logs.forEach(l => {
            if(!groups[l.weekID]) groups[l.weekID] = { items: [], sum: 0 };
            groups[l.weekID].items.push(l);
            groups[l.weekID].sum += l.delta;
            if(l.weekID === currentWeekID) currentWeekTotal += l.delta;
        });

        Object.keys(groups).sort().reverse().forEach(wId => {
            const data = groups[wId];
            const isCurrent = wId === currentWeekID;
            const div = document.createElement('div');
            div.className = 'week-box';
            div.innerHTML = `
                <div class="week-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
                    <span style="font-weight:700">Settimana ${wId.split('W')[1]}</span>
                    <span class="${data.sum >= 0 ? 'pos' : 'neg'}" style="font-weight:700">${fmt(data.sum)}</span>
                </div>
                <div class="${isCurrent ? '' : 'hidden'}">
                    <table>
                        ${data.items.map(i => `
                            <tr>
                                <td><strong>${new Date(i.date).toLocaleDateString('it-IT',{day:'2-digit', month:'short'})}</strong></td>
                                <td>${i.in}–${i.out} <div style="font-size:0.65rem; opacity:0.6">Pausa: ${i.pause}m</div></td>
                                <td class="${i.delta >= 0 ? 'pos' : 'neg'}" style="text-align:right"><strong>${fmt(i.delta)}</strong></td>
                                <td style="text-align:right"><button class="btn-del" onclick="event.stopPropagation(); del(${i.id})">×</button></td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
            `;
            container.appendChild(div);
        });

        mainBal.innerText = fmt(currentWeekTotal);
        mainBal.className = `kpi-value ${currentWeekTotal >= 0 ? 'pos' : 'neg'}`;
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(logs)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "backup_tempi.json";
        a.click();
    }

    function importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.readAsText(e.target.files[0]);
            reader.onload = e => { logs = JSON.parse(e.target.result); save(); };
        };
        input.click();
    }

    window.del = (id) => { if(confirm('Eliminare?')) { logs = logs.filter(l => l.id !== id); save(); } };
    
    init();
</script>
</body>
</html>
