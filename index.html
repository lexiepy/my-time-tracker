<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TimeTracker - Mobile Fix</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --accent-color: #0a84ff;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --success: #30d158;
            --danger: #ff453a;
            --border-color: #38383a;
            --border-radius: 18px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }

        .kpi-container {
            background: linear-gradient(180deg, #2c2c2e 0%, #1c1c1e 100%);
            padding: 25px 15px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .clock-icon { width: 35px; height: 35px; margin-bottom: 10px; color: var(--accent-color); }
        .kpi-value { font-size: 3.5rem; font-weight: 800; margin: 5px 0; letter-spacing: -2px; line-height: 1; }
        .kpi-label { color: var(--text-secondary); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }

        .input-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        /* FIX: Grid layout per evitare overflow */
        .grid-inputs { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 20px; 
        }
        
        .field { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            min-width: 0; /* Forza il contenuto a stare nel container */
            overflow: hidden; 
        }
        
        label { color: var(--text-secondary); font-size: 0.75rem; font-weight: 700; margin-left: 2px; }
        
        /* FIX: Reset stili per mobile */
        input {
            background: #2c2c2e;
            border: 1px solid transparent;
            color: white;
            padding: 12px 8px; /* Padding bilanciato */
            border-radius: 12px;
            font-size: 1rem;
            width: 100%;
            display: block;
            -webkit-appearance: none; /* Rimuove stile iOS */
            appearance: none;
            outline: none;
        }
        
        /* Rimuove le freccette che spostano il testo */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Fix specifico per l'icona orologio nativa che taglia il testo */
        input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            margin-left: 0;
            padding: 0;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .backup-section { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-util { flex: 1; background: #1c1c1e; border: 1px solid #333; color: #8e8e93; padding: 10px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
        
        .week-box { background: var(--card-bg); border-radius: var(--border-radius); margin-bottom: 12px; border: 1px solid var(--border-color); overflow: hidden; }
        .week-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        
        table { width: 100%; border-collapse: collapse; }
        td { padding: 14px 15px; border-top: 1px solid #2c2c2e; font-size: 0.85rem; }
        
        .pos { color: var(--success); }
        .neg { color: var(--danger); }
        .btn-del { color: #444; background: none; border: none; font-size: 1.2rem; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header class="kpi-container">
        <svg class="clock-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m4-2a8 8 0 11-16 0 8 8 0 0116 0z" />
        </svg>
        <div class="kpi-label">Saldo Settimanale</div>
        <div id="mainBalance" class="kpi-value">0h 0m</div>
    </header>

    <div class="input-card">
        <div class="grid-inputs">
            <div class="field"><label>Data</label><input type="date" id="d_date"></div>
            <div class="field"><label>Pausa Reale (min)</label><input type="number" id="d_break" value="30"></div>
            <div class="field"><label>Ingresso</label><input type="time" id="d_in" value="08:00"></div>
            <div class="field"><label>Uscita</label><input type="time" id="d_out" value="16:00"></div>
        </div>
        <button class="btn-submit" onclick="addEntry()">Registra Giornata</button>
    </div>

    <div class="backup-section">
        <button class="btn-util" onclick="exportData()">📦 BACKUP</button>
        <button class="btn-util" onclick="importData()">📥 CARICA</button>
    </div>

    <div id="history"></div>
</div>

<script>
    const TARGET_MINUTES = 8 * 60; 
    const FRIDAY_TARGET = 6 * 60;
    const MAX_FREE_BREAK = 30;

    document.getElementById('d_date').valueAsDate = new Date();
    let logs = JSON.parse(localStorage.getItem('timeLogs_v6')) || [];

    function getISOWeek(date) {
        const d = new Date(date);
        d.setHours(0,0,0,0);
        d.setDate(d.getDate() + 4 - (d.getDay() || 7));
        return `${d.getFullYear()}-W${Math.ceil((((d - new Date(d.getFullYear(),0,1)) / 86400000) + 1) / 7)}`;
    }

    function addEntry() {
        const d_date = document.getElementById('d_date').value;
        const d_in = document.getElementById('d_in').value;
        const d_out = document.getElementById('d_out').value;
        const realBreak = parseInt(document.getElementById('d_break').value) || 0;

        if(!d_date || !d_in || !d_out) return;

        const [h1, m1] = d_in.split(':').map(Number);
        const [h2, m2] = d_out.split(':').map(Number);
        
        const presence = (h2 * 60 + m2) - (h1 * 60 + m1);
        const isFri = new Date(d_date).getDay() === 5;
        const target = isFri ? FRIDAY_TARGET : TARGET_MINUTES;

        const extraBreak = (!isFri && realBreak > MAX_FREE_BREAK) ? (realBreak - MAX_FREE_BREAK) : 0;
        const delta = presence - target - extraBreak;

        logs.push({ id: Date.now(), date: d_date, weekID: getISOWeek(d_date), in: d_in, out: d_out, pause: realBreak, delta: delta });
        logs.sort((a,b) => new Date(b.date) - new Date(a.date));
        save();
    }

    function save() {
        localStorage.setItem('timeLogs_v6', JSON.stringify(logs));
        render();
    }

    function fmt(m) {
        const s = m >= 0 ? "+" : "-";
        const a = Math.abs(m);
        return `${s}${Math.floor(a/60)}h ${a%60}m`;
    }

    function render() {
        const container = document.getElementById('history');
        const mainBal = document.getElementById('mainBalance');
        container.innerHTML = '';
        const currentWeekID = getISOWeek(new Date());
        let currentWeekTotal = 0;
        const groups = {};

        logs.forEach(l => {
            if(!groups[l.weekID]) groups[l.weekID] = { items: [], sum: 0 };
            groups[l.weekID].items.push(l);
            groups[l.weekID].sum += l.delta;
            if(l.weekID === currentWeekID) currentWeekTotal += l.delta;
        });

        Object.keys(groups).sort().reverse().forEach(wId => {
            const data = groups[wId];
            const isCurrent = wId === currentWeekID;
            const div = document.createElement('div');
            div.className = 'week-box';
            div.innerHTML = `
                <div class="week-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
                    <span style="font-weight:700; font-size:0.9rem">Settimana ${wId.split('W')[1]}</span>
                    <span class="${data.sum >= 0 ? 'pos' : 'neg'}" style="font-weight:700">${fmt(data.sum)}</span>
                </div>
                <div class="${isCurrent ? '' : 'hidden'}">
                    <table>
                        ${data.items.map(i => `
                            <tr>
                                <td><strong>${new Date(i.date).toLocaleDateString('it-IT',{day:'2-digit', month:'short'})}</strong></td>
                                <td>${i.in}–${i.out} <div style="font-size:0.65rem; color:#555">Pausa: ${i.pause}m</div></td>
                                <td class="${i.delta >= 0 ? 'pos' : 'neg'}" style="text-align:right"><strong>${fmt(i.delta)}</strong></td>
                                <td style="text-align:right"><button class="btn-del" onclick="event.stopPropagation(); del(${i.id})">×</button></td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
            `;
            container.appendChild(div);
        });

        mainBal.innerText = fmt(currentWeekTotal);
        mainBal.className = `kpi-value ${currentWeekTotal >= 0 ? 'pos' : 'neg'}`;
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(logs)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "backup_tempi.json";
        a.click();
    }

    function importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.readAsText(e.target.files[0]);
            reader.onload = e => { logs = JSON.parse(e.target.result); save(); };
        };
        input.click();
    }

    window.del = (id) => { if(confirm('Eliminare?')) { logs = logs.filter(l => l.id !== id); save(); } };
    render();
</script>
</body>
</html>
