<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTracker Pro</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --accent-color: #0a84ff;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --success: #30d158;
            --danger: #ff453a;
            --border-color: #38383a;
            --border-radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10s); } to { opacity: 1; transform: translateY(0); } }

        .kpi-container {
            background: linear-gradient(145deg, #2c2c2e 0%, #1c1c1e 100%);
            padding: 35px 20px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .clock-icon {
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
            color: var(--accent-color);
            width: 32px;
            height: 32px;
            margin-bottom: 8px;
        }

        .kpi-label { color: var(--text-secondary); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .kpi-value { font-size: 3.8rem; font-weight: 800; margin: 5px 0; letter-spacing: -2px; display: flex; align-items: center; justify-content: center; }

        .input-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--border-radius);
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        label { color: var(--text-secondary); font-size: 0.75rem; font-weight: 600; margin-left: 4px; }
        
        input {
            background: #2c2c2e;
            border: 1px solid transparent;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s;
        }
        input:focus { border-color: var(--accent-color); background: #3a3a3c; outline: none; }
        
        .btn-submit {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-submit:active { transform: scale(0.98); }

        .backup-controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-backup {
            flex: 1;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-backup:hover { background: #1c1c1e; color: white; }

        .week-box {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            overflow: hidden;
        }
        .week-header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: rgba(255,255,255,0.02);
        }
        .week-title { font-weight: 700; font-size: 0.95rem; }
        .week-delta { font-weight: 700; font-size: 0.9rem; padding: 6px 12px; border-radius: 10px; background: rgba(0,0,0,0.3); }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 20px; color: var(--text-secondary); font-size: 0.65rem; text-transform: uppercase; background: rgba(0,0,0,0.1); }
        td { padding: 14px 20px; border-bottom: 1px solid #2c2c2e; font-size: 0.9rem; }
        
        .pos { color: var(--success); }
        .neg { color: var(--danger); }
        .btn-del { color: #555; background: none; border: none; font-size: 1.2rem; cursor: pointer; transition: color 0.2s; }
        .btn-del:hover { color: var(--danger); }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header class="kpi-container">
        <!-- Icona Orologio SVG -->
        <svg class="clock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <div class="kpi-label">Saldo Settimanale</div>
        <div id="mainBalance" class="kpi-value">0h 0m</div>
        <div style="font-size: 0.75rem; color: var(--text-secondary); opacity: 0.7;">Target 3gg/settimana</div>
    </header>

    <div class="input-card">
        <div class="grid-inputs">
            <div class="field"><label>Data</label><input type="date" id="d_date"></div>
            <div class="field"><label>Pausa (min)</label><input type="number" id="d_break" value="30"></div>
            <div class="field"><label>Ingresso</label><input type="time" id="d_in" value="09:00"></div>
            <div class="field"><label>Uscita</label><input type="time" id="d_out" value="18:00"></div>
        </div>
        <button class="btn-submit" onclick="addEntry()">Registra Sessione</button>
    </div>

    <div class="backup-controls">
        <button class="btn-backup" onclick="exportData()">📤 Esporta Dati</button>
        <button class="btn-backup" onclick="importData()">📥 Importa Dati</button>
    </div>

    <div id="history"></div>
</div>

<script>
    const TARGETS = { standard: 8, friday: 6 };
    document.getElementById('d_date').valueAsDate = new Date();

    let logs = JSON.parse(localStorage.getItem('timeLogs_v3')) || [];

    function getISOWeek(date) {
        const d = new Date(date);
        d.setHours(0,0,0,0);
        d.setDate(d.getDate() + 4 - (d.getDay() || 7));
        const yearStart = new Date(d.getFullYear(),0,1);
        const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        return `${d.getFullYear()}-W${weekNo}`;
    }

    function addEntry() {
        const dateVal = document.getElementById('d_date').value;
        const inVal = document.getElementById('d_in').value;
        const outVal = document.getElementById('d_out').value;
        const breakVal = parseInt(document.getElementById('d_break').value) || 0;

        if(!dateVal || !inVal || !outVal) return;

        const d = new Date(dateVal);
        const [h1, m1] = inVal.split(':').map(Number);
        const [h2, m2] = outVal.split(':').map(Number);
        
        let worked = (h2 * 60 + m2) - (h1 * 60 + m1);
        const isFri = d.getDay() === 5;
        const targetMin = (isFri ? TARGETS.friday : TARGETS.standard) * 60;
        const pause = isFri ? 0 : breakVal;
        
        const delta = worked - pause - targetMin;

        logs.push({
            id: Date.now(),
            date: dateVal,
            weekID: getISOWeek(d),
            in: inVal,
            out: outVal,
            pause: pause,
            delta: delta
        });

        logs.sort((a,b) => new Date(b.date) - new Date(a.date));
        save();
    }

    function save() {
        localStorage.setItem('timeLogs_v3', JSON.stringify(logs));
        render();
    }

    function fmt(m) {
        const s = m >= 0 ? "+" : "-";
        const a = Math.abs(m);
        return `${s}${Math.floor(a/60)}h ${a%60}m`;
    }

    function render() {
        const container = document.getElementById('history');
        const mainBal = document.getElementById('mainBalance');
        container.innerHTML = '';
        
        const currentWeekID = getISOWeek(new Date());
        let currentWeekTotal = 0;
        const groups = {};

        logs.forEach(l => {
            if(!groups[l.weekID]) groups[l.weekID] = { items: [], sum: 0 };
            groups[l.weekID].items.push(l);
            groups[l.weekID].sum += l.delta;
            if(l.weekID === currentWeekID) currentWeekTotal += l.delta;
        });

        const sortedWeekIDs = Object.keys(groups).sort().reverse();

        sortedWeekIDs.forEach(wId => {
            const data = groups[wId];
            const isCurrent = (wId === currentWeekID);
            
            const div = document.createElement('div');
            div.className = 'week-box';
            div.innerHTML = `
                <div class="week-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
                    <span class="week-title">${wId.replace('-W', ' · Settimana ')} ${isCurrent ? '<span style="color:var(--accent-color); font-size:0.7rem; margin-left:5px;">● CORRENTE</span>' : ''}</span>
                    <span class="week-delta ${data.sum >= 0 ? 'pos' : 'neg'}">${fmt(data.sum)}</span>
                </div>
                <div class="table-wrapper ${!isCurrent ? 'hidden' : ''}">
                    <table>
                        <thead><tr><th>Giorno</th><th>Ore</th><th>Δ</th><th></th></tr></thead>
                        <tbody>
                            ${data.items.map(i => `
                                <tr>
                                    <td><strong>${new Date(i.date).toLocaleDateString('it-IT',{weekday:'short', day:'2-digit'})}</strong></td>
                                    <td>${i.in}–${i.out}</td>
                                    <td class="${i.delta >= 0 ? 'pos' : 'neg'}"><strong>${fmt(i.delta)}</strong></td>
                                    <td style="text-align:right"><button class="btn-del" onclick="event.stopPropagation(); del(${i.id})">×</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            container.appendChild(div);
        });

        mainBal.innerText = fmt(currentWeekTotal);
        mainBal.className = `kpi-value ${currentWeekTotal >= 0 ? 'pos' : 'neg'}`;
    }

    function exportData() {
        if (logs.length === 0) return alert("Nessun dato presente.");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(logs));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "tracker_backup_" + new Date().toISOString().split('T')[0] + ".json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }

    function importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.readAsText(file, 'UTF-8');
            reader.onload = e => {
                try {
                    logs = JSON.parse(e.target.result);
                    save();
                } catch(err) { alert("File non valido."); }
            }
        }
        input.click();
    }

    window.del = (id) => { if(confirm('Eliminare?')) { logs = logs.filter(l => l.id !== id); save(); } };
    render();
</script>
</body>
</html>
