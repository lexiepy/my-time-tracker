<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTracker Pro - Weekly</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --accent-color: #0a84ff;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --success: #30d158;
            --danger: #ff453a;
            --border-color: #38383a;
            --border-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 800px; }

        /* Header & KPI */
        header { margin-bottom: 30px; text-align: center; }
        .kpi-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            display: inline-block;
            min-width: 280px;
        }
        .kpi-label { color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
        .kpi-value { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; }

        /* Form */
        .input-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            align-items: end;
            border: 1px solid var(--border-color);
        }
        .field { display: flex; flex-direction: column; gap: 5px; }
        label { color: var(--text-secondary); font-size: 0.75rem; font-weight: 600; padding-left: 4px; }
        input {
            background: #2c2c2e;
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
        }
        input:focus { border-color: var(--accent-color); }
        
        .btn-add {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-add:active { transform: scale(0.98); }

        /* Weekly Accordion Style */
        details {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            overflow: hidden;
        }
        summary {
            padding: 15px 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
            background: #2c2c2e;
        }
        summary::-webkit-details-marker { display: none; }
        summary:hover { background: #3a3a3c; }

        .week-info { display: flex; align-items: center; gap: 15px; }
        .week-title { font-size: 1rem; color: var(--text-primary); }
        .week-badge { 
            font-size: 0.85rem; 
            padding: 4px 10px; 
            border-radius: 20px; 
            background: rgba(255,255,255,0.1);
        }

        /* Table Style */
        .table-container { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px;
        }
        th {
            color: var(--text-secondary);
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        td {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        tr:last-child td { border-bottom: none; }

        .positive { color: var(--success); }
        .negative { color: var(--danger); }
        
        .btn-delete {
            background: transparent;
            color: #ff453a;
            border: 1px solid #ff453a;
            padding: 4px 8px;
            font-size: 0.7rem;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .input-panel { grid-template-columns: 1fr 1fr; }
            .btn-add { grid-column: span 2; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="kpi-card">
            <div class="kpi-label">Saldo Totale Cumulativo</div>
            <div id="totalBalance" class="kpi-value">0h 0m</div>
        </div>
    </header>

    <div class="input-panel">
        <div class="field">
            <label>Data</label>
            <input type="date" id="date">
        </div>
        <div class="field">
            <label>Ingresso</label>
            <input type="time" id="entry" value="09:00">
        </div>
        <div class="field">
            <label>Uscita</label>
            <input type="time" id="exit" value="18:00">
        </div>
        <div class="field">
            <label>Pausa (min)</label>
            <input type="number" id="break" value="30">
        </div>
        <button class="btn-add" onclick="addEntry()">Aggiungi</button>
    </div>

    <div id="weeklyGroups">
        <!-- I gruppi settimanali appariranno qui -->
    </div>
</div>

<script>
    const STD_HOURS_WEEK = 8;
    const STD_HOURS_FRI = 6;

    document.getElementById('date').valueAsDate = new Date();

    let logs = JSON.parse(localStorage.getItem('workLogs')) || [];

    // Utility: Ottiene il numero della settimana
    function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function addEntry() {
        const dateInput = document.getElementById('date').value;
        const entryTime = document.getElementById('entry').value;
        const exitTime = document.getElementById('exit').value;
        const breakMin = parseInt(document.getElementById('break').value) || 0;
        
        if (!dateInput || !entryTime || !exitTime) return alert("Compila tutti i campi!");

        const dateVal = new Date(dateInput);
        const [hIn, mIn] = entryTime.split(':').map(Number);
        const [hOut, mOut] = exitTime.split(':').map(Number);
        
        let workedMinutes = (hOut * 60 + mOut) - (hIn * 60 + mIn);
        const isFriday = dateVal.getDay() === 5;
        const targetMinutes = isFriday ? STD_HOURS_FRI * 60 : STD_HOURS_WEEK * 60;
        const actualBreak = isFriday ? 0 : breakMin;
        const delta = workedMinutes - actualBreak - targetMinutes;

        const newLog = {
            id: Date.now(),
            date: dateInput,
            week: getWeekNumber(dateVal),
            year: dateVal.getFullYear(),
            entry: entryTime,
            exit: exitTime,
            break: actualBreak,
            target: targetMinutes / 60,
            delta: delta
        };

        logs.push(newLog);
        logs.sort((a, b) => new Date(b.date) - new Date(a.date));
        save();
    }

    function deleteEntry(id) {
        if(confirm("Eliminare questa riga?")) {
            logs = logs.filter(l => l.id !== id);
            save();
        }
    }

    function save() {
        localStorage.setItem('workLogs', JSON.stringify(logs));
        render();
    }

    function formatMinutes(totalMin) {
        const sign = totalMin >= 0 ? "+" : "-";
        const absMin = Math.abs(totalMin);
        const h = Math.floor(absMin / 60);
        const m = absMin % 60;
        return `${sign}${h}h ${m}m`;
    }

    function render() {
        const container = document.getElementById('weeklyGroups');
        const balanceEl = document.getElementById('totalBalance');
        container.innerHTML = '';
        
        let totalDelta = 0;

        // Raggruppamento per Anno e Settimana
        const groups = logs.reduce((acc, log) => {
            const key = `${log.year}-W${log.week}`;
            if (!acc[key]) acc[key] = { logs: [], weekDelta: 0 };
            acc[key].logs.push(log);
            acc[key].weekDelta += log.delta;
            totalDelta += log.delta;
            return acc;
        }, {});

        Object.keys(groups).forEach(key => {
            const group = groups[key];
            const details = document.createElement('details');
            details.open = true; // Inizia aperto

            const summary = document.createElement('summary');
            summary.innerHTML = `
                <span class="week-title">Settimana ${key.split('-W')[1]} (${key.split('-')[0]})</span>
                <div class="week-info">
                    <span class="week-badge ${group.weekDelta >= 0 ? 'positive' : 'negative'}">
                        Settimana: ${formatMinutes(group.weekDelta)}
                    </span>
                    <span>▾</span>
                </div>
            `;

            const tableWrapper = document.createElement('div');
            tableWrapper.className = 'table-container';
            
            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Orario</th>
                            <th>Pausa</th>
                            <th>Saldo</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            group.logs.forEach(log => {
                const d = new Date(log.date);
                const formattedDate = d.toLocaleDateString('it-IT', { weekday: 'short', day: '2-digit', month: '2-digit' });
                tableHTML += `
                    <tr>
                        <td><strong>${formattedDate}</strong></td>
                        <td>${log.entry} - ${log.exit}</td>
                        <td style="color:var(--text-secondary)">${log.break}m</td>
                        <td class="${log.delta >= 0 ? 'positive' : 'negative'}"><strong>${formatMinutes(log.delta)}</strong></td>
                        <td><button class="btn-delete" onclick="deleteEntry(${log.id})">×</button></td>
                    </tr>
                `;
            });

            tableHTML += `</tbody></table>`;
            tableWrapper.innerHTML = tableHTML;
            
            details.appendChild(summary);
            details.appendChild(tableWrapper);
            container.appendChild(details);
        });

        balanceEl.innerText = formatMinutes(totalDelta);
        balanceEl.className = `kpi-value ${totalDelta >= 0 ? 'positive' : 'negative'}`;
    }

    render();
</script>

</body>
</html>
